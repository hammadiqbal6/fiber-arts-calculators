name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/audit/run-all.mjs
      - name: Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true
