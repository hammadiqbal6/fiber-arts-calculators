<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="ywTitle ywDesc">
  <title id="ywTitle">Craft Yarn Council yarn weight categories 07</title>
  <desc id="ywDesc">Horizontal chart of yarn weight symbols 0 lace through 7 jumbo with relative strand thickness. Redrawn for FiberCalc; credit Craft Yarn Council YarnStandards.com.</desc>
  <rect width="1200" height="900" fill="#fffdf8"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="36" fill="#1f3f36">Yarn weight categories (CYC 07)</text>
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="18" fill="#4a5651">Relative thickness only  always swatch. Source: Craft Yarn Council Standard Yarn Weight System.</text>
  <g font-family="Segoe UI, sans-serif" font-size="16" fill="#1c2421">
    <!-- columns -->
    <g transform="translate(60,160)">
      <rect width="130" height="620" fill="#e8f0ec" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">0 Lace</text>
      <path d="M65 120 v400" stroke="#2f5d50" stroke-width="2" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">3340 sts</text>
      <text x="65" y="585" text-anchor="middle" font-size="13" fill="#4a5651">/43 knit*</text>
    </g>
    <g transform="translate(200,160)">
      <rect width="130" height="620" fill="#f7f1e7" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">1 Super Fine</text>
      <path d="M65 120 v400" stroke="#2f5d50" stroke-width="3.5" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">2732 sts</text>
    </g>
    <g transform="translate(340,160)">
      <rect width="130" height="620" fill="#e8f0ec" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">2 Fine</text>
      <path d="M65 120 v400" stroke="#2f5d50" stroke-width="5" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">2326 sts</text>
    </g>
    <g transform="translate(480,160)">
      <rect width="130" height="620" fill="#f7f1e7" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">3 Light / DK</text>
      <path d="M65 120 v400" stroke="#2f5d50" stroke-width="7" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">2124 sts</text>
    </g>
    <g transform="translate(620,160)">
      <rect width="130" height="620" fill="#e8f0ec" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">4 Medium</text>
      <path d="M65 120 v400" stroke="#c45c26" stroke-width="10" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">1620 sts</text>
      <text x="65" y="585" text-anchor="middle" font-size="12" fill="#c45c26">common</text>
    </g>
    <g transform="translate(760,160)">
      <rect width="130" height="620" fill="#f7f1e7" stroke="#d5cdc0"/>
      <text x="65" y="40" text-anchor="middle" font-weight="700">5 Bulky</text>
      <path d="M65 120 v400" stroke="#2f5d50" stroke-width="14" fill="none"/>
      <text x="65" y="560" text-anchor="middle" font-size="13" fill="#4a5651">1215 sts</text>
    </g>
    <g transform="translate(900,160)">
      <rect width="110" height="620" fill="#e8f0ec" stroke="#d5cdc0"/>
      <text x="55" y="40" text-anchor="middle" font-weight="700">6 Super</text>
      <path d="M55 120 v400" stroke="#2f5d50" stroke-width="18" fill="none"/>
      <text x="55" y="560" text-anchor="middle" font-size="13" fill="#4a5651">711 sts</text>
    </g>
    <g transform="translate(1020,160)">
      <rect width="120" height="620" fill="#f7f1e7" stroke="#d5cdc0"/>
      <text x="60" y="40" text-anchor="middle" font-weight="700">7 Jumbo</text>
      <path d="M60 120 v400" stroke="#2f5d50" stroke-width="24" fill="none"/>
      <text x="60" y="560" text-anchor="middle" font-size="13" fill="#4a5651">d6 sts</text>
    </g>
  </g>
  <text x="60" y="860" font-family="Segoe UI, sans-serif" font-size="14" fill="#4a5651">*Guidelines only. Lace often knit on larger needles. Redrawn summary  verify on craftyarncouncil.com/standards/yarn-weight-system</text>
</svg>
