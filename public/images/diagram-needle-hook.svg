<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="nhTitle nhDesc">
  <title id="nhTitle">Knitting needle metric sizes vs US labels</title>
  <desc id="nhDesc">Diagram of knitting needle shafts from 2.25 mm (US 1) to 10 mm (US 15) with millimetre labels. Redrawn from Craft Yarn Council Hooks and Needles chart.</desc>
  <rect width="1200" height="900" fill="#fffdf8"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1f3f36">Needle sizes: trust millimetres</text>
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="18" fill="#4a5651">US numbers vary by brand. CYC publishes metric ” US ranges  redrawn here for FiberCalc.</text>
  <g font-family="Segoe UI, sans-serif" fill="#1c2421">
    <!-- needles as horizontal bars -->
    <g transform="translate(80,160)">
      <text x="0" y="0" font-size="16" font-weight="700">Metric (mm)</text>
      <text x="900" y="0" font-size="16" font-weight="700" text-anchor="end">Typical US</text>
    </g>
    <g stroke-linecap="round">
      <g transform="translate(80,200)"><line x1="0" y1="0" x2="520" y2="0" stroke="#2f5d50" stroke-width="4"/><text x="540" y="6" font-size="18">2.25 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 1</text></g>
      <g transform="translate(80,270)"><line x1="0" y1="0" x2="560" y2="0" stroke="#2f5d50" stroke-width="6"/><text x="580" y="6" font-size="18">3.25 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 3</text></g>
      <g transform="translate(80,340)"><line x1="0" y1="0" x2="600" y2="0" stroke="#2f5d50" stroke-width="8"/><text x="620" y="6" font-size="18">4.0 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 6</text></g>
      <g transform="translate(80,410)"><line x1="0" y1="0" x2="640" y2="0" stroke="#c45c26" stroke-width="10"/><text x="660" y="6" font-size="18">5.0 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 8</text></g>
      <g transform="translate(80,480)"><line x1="0" y1="0" x2="680" y2="0" stroke="#2f5d50" stroke-width="12"/><text x="700" y="6" font-size="18">5.5 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 9</text></g>
      <g transform="translate(80,550)"><line x1="0" y1="0" x2="720" y2="0" stroke="#2f5d50" stroke-width="14"/><text x="740" y="6" font-size="18">6.5 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 10½</text></g>
      <g transform="translate(80,620)"><line x1="0" y1="0" x2="760" y2="0" stroke="#2f5d50" stroke-width="18"/><text x="780" y="6" font-size="18">8.0 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 11</text></g>
      <g transform="translate(80,700)"><line x1="0" y1="0" x2="800" y2="0" stroke="#2f5d50" stroke-width="22"/><text x="820" y="6" font-size="18">10 mm</text><text x="1040" y="6" text-anchor="end" font-size="18">US 15</text></g>
    </g>
  </g>
  <text x="60" y="820" font-family="Segoe UI, sans-serif" font-size="16" fill="#4a5651">Crochet hooks use letter/number labels differently  convert with the needle &amp; hook tool.</text>
  <text x="60" y="860" font-family="Segoe UI, sans-serif" font-size="14" fill="#4a5651">Credit: Craft Yarn Council Hooks &amp; Needles chart (yarnstandards.com). Not a substitute for stamped mm on your tools.</text>
</svg>
